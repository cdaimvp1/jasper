<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>JASPER gecko icon — favicon (theme-adaptive)</title>
  <!-- Same technique as jasper-focus-favicon-adaptive.svg: renders the black
       gecko PNG on a light browser tab, the off-white one on a dark tab, via
       prefers-color-scheme on this stylesheet - no JS, no duplicate <link>
       tags. The gecko pack ships raster-only assets (no vector master), so
       both PNGs are embedded as data URIs and toggled with opacity/display
       rather than swapping <path> fill colors like the focus version did.
       Updated 2026-08-02 to the jasper-gecko-icon-pack-optimized.zip mark
       (heavier head/limbs/feet/toe pads/tail, readable at 16-32px) -
       replaces the earlier, less-refined gecko pack this SVG shipped with. -->
  <style>
    .jg-light { display: block; }
    .jg-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .jg-light { display: none; }
      .jg-dark { display: block; }
    }
  </style>
  <image class="jg-light" href="data:image/png;base64," width="32" height="32"/>
  <image class="jg-dark" href="data:image/png;base64," width="32" height="32"/>
</svg>
