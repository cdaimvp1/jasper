<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>JASPER gecko icon — favicon</title>
  <!-- Flattened to a single unconditional off-white image (2026-08-02, Marc's
       direct call) - the prior version toggled black/off-white via a
       prefers-color-scheme media query, but that depends on the browser
       correctly reporting dark mode (Edge has its own Appearance override
       under edge://settings/appearance, independent of the Windows theme),
       and Marc was still seeing black across the tab, the installed app,
       and the taskbar after switching to dark. Off-white is now the one
       guaranteed rendering, matching every other icon slot (manifest,
       desktop shortcut) - simpler than debugging three separate caches. -->
  <image href="data:image/png;base64," width="32" height="32"/>
</svg>
