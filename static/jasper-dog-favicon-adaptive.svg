<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>JASPER dog icon — favicon</title>
  <!-- Flattened to a single unconditional off-white image (task #146,
       2026-08-04), matching the same decision already made for the gecko
       favicon it replaces (2026-08-02, Marc's direct call) - a
       prefers-color-scheme toggle depends on the browser correctly
       reporting dark mode (Edge has its own Appearance override under
       edge://settings/appearance, independent of the Windows theme), and
       Marc was still seeing the wrong color across the tab/installed
       app/taskbar after switching. Off-white is the one guaranteed
       rendering, matching every other icon slot (manifest, desktop
       shortcut). -->
  <image href="data:image/png;base64," width="32" height="32"/>
</svg>
