<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>JASPER focus icon — favicon (theme-adaptive)</title>
  <!-- Renders black on a light browser tab, white on a dark one. The color
       lives in this stylesheet rather than the shapes below, so a single
       file adapts via the browser's own prefers-color-scheme - no JS, no
       duplicate <link> tags. Chosen over separate media-scoped <link>
       elements because this works anywhere the SVG is fetched as a favicon,
       not just user agents that honor the `media` attribute on <link
       rel="icon"> (added 2026-07-29, matching assets Marc supplied). -->
  <style>
    .jf-mark { fill: #000; }
    .jf-frame { stroke: #000; }
    @media (prefers-color-scheme: dark) {
      .jf-mark { fill: #FFFFFF; }
      .jf-frame { stroke: #FFFFFF; }
    }
  </style>
  <path
    class="jf-frame"
    d="M22 9H9v13M42 9h13v13M9 42v13h13M55 42v13H42"
    fill="none"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <g transform="translate(17.15 17.15) scale(.45)">
    <path
      class="jf-mark"
      stroke="none"
      d="M20 8h34v31c0 12-7.5 19-20 19-13 0-22-7-22-19v-6h12v6c0 5.5 3.2 8 9.5 8S42 44.5 42 39V20H20z"
    />
  </g>
</svg>
