<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>JASPER muzzle icon — favicon</title>
  <!-- Flattened to a single unconditional image (task #164, 2026-08-04), same
       decision as the two prior icon swaps (gecko, dog) - a prefers-color-scheme
       toggle depends on the browser correctly reporting dark mode, and Edge has
       its own Appearance override under edge://settings/appearance independent
       of the Windows/content theme signal, so Marc kept seeing the wrong variant
       across the tab/installed app/taskbar. This pack's own light-theme artwork
       is also broken (malformed/disconnected shapes at every size and tier we
       checked - 16px through the 1024px source master), so the color/"dark"
       variant is used everywhere: it has a thick black outline + white highlight
       giving it self-contained contrast against either a light or dark tab bar,
       unlike the flat single-tone silhouettes used by the earlier packs. -->
  <image href="data:image/png;base64," width="32" height="32"/>
</svg>
